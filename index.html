<style>
:root{
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --paper:#F5F4EF;
  --ink:#171717;
  --ink-2:#77756E;
  --ink-3:#A3A199;
  --accent:#5B4FE9;
  --accent-soft:rgba(91,79,233,.16);
  --line:rgba(23,23,23,.10);
  --line-strong:rgba(23,23,23,.20);
  --side-w:340px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang HK","Hiragino Sans CNS","Noto Sans HK","Microsoft JhengHei","Helvetica Neue",sans-serif;
  --latin:"Helvetica Neue",-apple-system,BlinkMacSystemFont,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  color:var(--ink);
  background:var(--paper);
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ── 骨架 ── */
.app{display:flex;height:100vh;height:100dvh;width:100%}
.side{
  width:var(--side-w);flex:0 0 var(--side-w);
  display:flex;flex-direction:column;
  background:var(--paper);
  border-right:1px solid var(--line);
  min-height:0;
}
.mapcol{flex:1;position:relative;min-width:0}
.app.folded .side{display:none}
#sideToggle{position:absolute;left:12px;top:12px;z-index:600;padding:6px 10px;line-height:1}
@media (max-width:820px){ #sideToggle{display:none} }
#map{position:absolute;inset:0;background:#E9E7E0}

/* ── Sidebar 頭 ── */
.side-head{padding:22px 22px 14px;border-bottom:1px solid var(--line)}
.brand{font-size:21px;font-weight:500;letter-spacing:.01em;margin:0;line-height:1.25}
.brand span{display:block;font-family:var(--latin);font-size:11px;font-weight:400;color:var(--ink-3);
  letter-spacing:.14em;text-transform:lowercase;margin-bottom:5px}
.meta{margin:8px 0 0;font-size:12px;color:var(--ink-2)}
.meta button{color:var(--ink-2);border-bottom:1px solid var(--line-strong)}
.meta button:hover{color:var(--ink)}
.about{
  margin:12px 0 0;font-size:13px;color:var(--ink-2);line-height:1.75;
  border-left:2px solid var(--line-strong);padding-left:12px;display:none;
}
.about.on{display:block}

/* ── 區域切換 ── */
.mode{display:flex;gap:2px;margin:14px 22px 0;padding:2px;background:rgba(23,23,23,.05);border-radius:4px}
.mode button{flex:1;font-size:13px;color:var(--ink-2);padding:6px 0;border-radius:3px;text-align:center}
.mode button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(23,23,23,.08)}
.region-bar[hidden]{display:none}
.alb-lab{padding:16px 22px 5px;font-size:11.5px;letter-spacing:.06em;color:var(--ink-3)}
.alb-lab b{font-weight:400;color:var(--ink-2)}
.sg-name{font-size:14.5px;letter-spacing:-.01em}
.sg-meta{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.route-tag{margin:0 0 2px;font-size:12.5px;color:var(--accent)}
.route-tag button{color:var(--accent);border-bottom:1px solid rgba(91,79,233,.35)}
.region-bar{display:flex;align-items:flex-end;justify-content:space-between;padding:14px 22px 0}
.region{display:flex;gap:18px}
.filt-btn{font-size:12.5px;color:var(--ink-3);padding-bottom:8px}
.filt-btn:hover,.filt-btn[aria-expanded="true"]{color:var(--ink)}
.filters{padding:10px 22px 14px;border-bottom:1px solid var(--line);background:rgba(23,23,23,.022)}
.f-lab{font-size:11px;letter-spacing:.1em;color:var(--ink-3);margin:11px 0 3px}
.f-lab:first-child{margin-top:2px}
.filters label{display:flex;align-items:center;gap:9px;font-size:13px;padding:3px 0;cursor:pointer}
.filters input{width:14px;height:14px;accent-color:var(--accent);margin:0}
.f-reset{margin-top:12px;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--line-strong)}
.f-reset:hover{color:var(--ink)}
.region button{font-size:14px;color:var(--ink-3);padding-bottom:8px;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.region button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.region-note{padding:8px 22px 0;font-size:12px;color:var(--ink-3);min-height:20px}

/* ── 列表 ── */
.list-wrap{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px 0 calc(40px + var(--sab))}
.list-lab{padding:14px 22px 6px;font-size:11.5px;letter-spacing:.1em;color:var(--ink-3)}
.list{list-style:none;margin:0;padding:0}
.list li+li{border-top:1px solid var(--line)}
.list button{display:block;width:100%;text-align:left;padding:13px 22px}
.list button:hover,.list button:focus-visible{background:rgba(23,23,23,.035)}
.list li.on button{background:rgba(91,79,233,.07);box-shadow:inset 2px 0 0 var(--accent)}
.pl-name{font-size:15px;letter-spacing:-.01em}
.pl-sub{font-size:12px;color:var(--ink-3);margin-left:7px}
.pl-year{float:right;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-left:8px}
.pl-tag{font-size:11px;color:var(--ink-2);border:1px solid var(--line-strong);border-radius:2px;padding:0 4px;margin-left:7px;vertical-align:1px}
.pl-songs{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.65}
.pl-songs i{font-style:normal;color:var(--ink-3);margin-right:4px}

/* ── Marker（方案二） ── */
.mk{width:34px;height:34px;display:flex;align-items:center;justify-content:center;position:relative}
.mk .halo{position:absolute;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);transition:width .2s ease,height .2s ease}
.z-far .mk .halo{width:16px;height:16px}
.z-far .mk .core{width:9px;height:9px}
.z-far .mk.area .core{width:5px;height:5px}
.z-far .mk.meta .core{width:9px;height:9px}
.z-far .mk.gone .core{width:10px;height:10px}
.mk .core{position:relative;width:13px;height:13px;border-radius:50%;background:var(--accent)}
.mk.area .core{width:7px;height:7px}
.mk.meta .core{width:13px;height:13px;border-radius:2px;background:var(--ink);transform:rotate(45deg)}
.mk.gone .core{width:14px;height:14px;background:transparent;border:1.5px solid var(--ink);opacity:.5}
.mk.changed .core::after{content:"";position:absolute;left:-3px;top:5.5px;width:19px;height:2.4px;background:var(--paper);transform:rotate(-45deg);border-radius:2px}
.mk:hover .core,.leaflet-marker-icon:focus .mk .core{transform:scale(1.25)}
.mk.meta:hover .core{transform:rotate(45deg) scale(1.25)}
.mk .core{transition:transform .18s ease}
.mk.on .core{box-shadow:0 0 0 3px rgba(91,79,233,.28)}
.mk.on.meta .core{box-shadow:0 0 0 3px rgba(23,23,23,.18)}

/* ── 地圖零件 ── */
.leaflet-container{font-family:var(--sans);background:#E9E7E0}
.leaflet-control-attribution{font-size:10.5px;background:rgba(245,244,239,.82)!important}
.map-btn{
  position:absolute;z-index:600;background:var(--paper);
  border:1px solid var(--line-strong);border-radius:var(--r,4px);
  font-size:12.5px;color:var(--ink-2);padding:6px 11px;
}
.map-btn:hover{color:var(--ink)}
#legendBtn{right:12px;bottom:26px}
.legend{
  position:absolute;right:12px;bottom:62px;z-index:600;display:none;
  background:var(--paper);border:1px solid var(--line-strong);border-radius:4px;
  padding:12px 14px;font-size:12.5px;line-height:2;
}
.legend.on{display:block}
.legend div{display:flex;align-items:center;gap:9px}
.legend .mk{width:22px;height:22px}
.legend .halo{width:20px;height:20px}

/* ── Popup ── */
.leaflet-popup-content-wrapper{background:var(--paper);border-radius:4px;box-shadow:0 6px 24px rgba(23,23,23,.14)}
.leaflet-popup-content{margin:16px 18px;width:262px!important;font-size:13px;line-height:1.7}
.leaflet-popup-tip{background:var(--paper)}
.pop-name{font-size:18px;font-weight:500;margin:0;letter-spacing:-.01em}
.pop-meta{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.pop-songs{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.pop-song{font-size:13.5px}
.pop-alb{color:var(--ink-2);font-size:12px}
.pop-song+.pop-song{margin-top:8px}
.pop-more{margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}
.pop-ctx{margin:10px 0 0;font-size:12.5px;color:var(--ink-2);line-height:1.7}

const songById  = Object.fromEntries(SONGS.map(s=>[s.id,s]));
const placeById = Object.fromEntries(PLACES.map(p=>[p.id,p]));

const NODES = PLACES.map(p=>{
  const refs = REFS.filter(r=>r.place===p.id);
  return {
    p, refs,
    kind: refs.some(r=>r.kind==="lyric") ? "lyric" : "meta",
    songs: refs.map(r=>r.song ? songById[r.song] : null).filter(Boolean)
  };
}).filter(o=>o.refs.length);
const nodeById = Object.fromEntries(NODES.map(o=>[o.p.id,o]));

const refsBySong = {};
REFS.forEach(r=>{ if(r.song){ (refsBySong[r.song] = refsBySong[r.song] || []).push(r); } });
const unmappedBySong = {};
UNMAPPED.forEach(u=>{ (unmappedBySong[u.song] = unmappedBySong[u.song] || []).push(u); });

/* ══════════ 路線 ══════════
   只收歌詞明確講出次序、而且核到實地行得通嘅。
   alb     ：上環 A2 出口見 → 歌賦街飲酒 → 下亞厘畢道（A2 行去歌賦街約 5–8 分鐘）
   spr     ：由上環到天后（港島綫同一條線，中間隔中環、金鐘、灣仔、銅鑼灣）
   nathanS ：土瓜灣搭 6C → 彌敦道 → 油麻地（6C 九龍城碼頭↔美孚，途經土瓜灣道、加士居道、彌敦道、油麻地）
   ams     ：土瓜灣夜機出發 → 阿姆斯特丹 → 德國轉機 → 冰島
             次序來自歌詞「轉機去德國再去冰島」；出發日期 2017-07-14 來自碟內文案。
             九龍城、深水埗唔入線 —— 嗰兩個係另一件事（小巴遊戲）。
   朗豪坊唔入線：歌詞冇講係咪同一晚接落去。
   其餘歌一律唔連。 */
const ROUTES = {
  alb:     ["sheungw","gough","albert"],
  spr:     ["sheungw","tinhau"],
  nathanS: ["tokwaw","nathanrd","ymt"],
  ams:     ["tokwaw","amsterdam","germany","iceland"]
};

const ROUTE_OF = {};
Object.entries(ROUTES).forEach(([sid,ids])=> ids.forEach((pid,i)=>
  (ROUTE_OF[pid] = ROUTE_OF[pid] || []).push({song:sid, step:i+1, total:ids.length})));

const SONG_ORDER = Object.fromEntries(SONGS.map((s,i)=>[s.id,i]));
const PREC   = {exact:"準確位置", area:"地區代表點"};
const STATUS = {gone:"已消失", changed:"已變質"};
const yearOf = s => s.first_year || s.year;
const esc = t => String(t==null?"":t).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q = s => encodeURIComponent("my little airport " + s);

/* 每個地方「最早出現」嘅歌 —— 列表按發佈順序排 */
NODES.forEach(o=>{
  o.debut = o.songs.length
    ? o.songs.reduce((a,s)=>{
        const ya = a ? yearOf(a) : Infinity, ys = yearOf(s);
        if(ys < ya) return s;
        if(ys === ya && SONG_ORDER[s.id] < SONG_ORDER[a.id]) return s;
        return a;
      }, null)
    : null;
  o.debutYear = o.debut ? yearOf(o.debut) : Infinity;
  o.debutIdx  = o.debut ? SONG_ORDER[o.debut.id] : Infinity;
});

function visible(o){
  if(STATE.only==="status") return !!o.p.status;
  const f = STATE.filters;
  if(!f[o.kind]) return false;
  if(!f[o.p.precision]) return false;
  return true;
}

/* 地圖：香港模式只 fit 香港點，世界模式 fit 晒（點全部照顯示） */
const inRegion = o => STATE.region==="hk" ? o.p.region==="hk" : true;
/* 列表：香港模式列香港，世界模式只列外地 */
const inList   = o => o.p.region === (STATE.region==="hk" ? "hk" : "away");

/* 世界模式：21 個外地點按地區分組。純粹係將平面清單排好，唔係主題策展，亦唔會連線。 */
const ZONES = ["歐洲","日本","台灣","中國大陸","東南亞","美洲","其他"];
function zoneOf(p){
  const {lat, lng} = p;
  if(lng >= -25 && lng <= 45  && lat >= 34   && lat <= 72)   return "歐洲";
  if(lng >= 122 && lng <= 154 && lat >= 24   && lat <= 46)   return "日本";
  if(lng >= 119 && lng <= 123 && lat >= 21.8 && lat <= 25.5) return "台灣";
  if(lng >= 73  && lng <= 135 && lat >= 18   && lat <= 54)   return "中國大陸";
  if(lng >= 92  && lng <= 142 && lat >= -11  && lat <= 24)   return "東南亞";
  if(lng <= -30) return "美洲";
  return "其他";
}

/* ══════════ 地圖 ══════════ */
const map = L.map("map",{zoomControl:false, scrollWheelZoom:true});
const narrow = () => window.matchMedia("(max-width:820px)").matches;
if(!narrow()) L.control.zoom({position:"bottomright"}).addTo(map);
map.attributionControl.setPosition(narrow() ? "topleft" : "bottomright");
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
  maxZoom:19, subdomains:"abcd", attribution:'&copy; OpenStreetMap &copy; CARTO'
}).addTo(map);

function markerHTML(o){
  const cls = ["mk",
    o.kind==="meta" ? "meta" : (o.p.precision==="area" ? "area" : ""),
    o.p.status || ""].filter(Boolean).join(" ");
  const halo = (o.kind!=="meta" && o.p.precision==="area") ? '<span class="halo"></span>' : "";
  return `<span class="${cls}">${halo}<span class="core"></span></span>`;
}

/* 歌詞證據只認 REFS 嘅 line 欄。留空＝冇直接歌詞證據，就唔顯示，唔會由 note 度撈句嘢頂上。 */
function lyricOf(r){ return r && r.line ? "「" + r.line + "」" : ""; }
function firstLine(o){
  const r = o.refs.find(x=>x.line);
  return r ? lyricOf(r) : "";
}

function popupHTML(o){
  const p = o.p;
  const bits = [ p.within && placeById[p.within] ? placeById[p.within].name : null,
                 PREC[p.precision],
                 p.status ? STATUS[p.status] : null ].filter(Boolean);
  const lead = o.songs[0];
  const song = lead
    ? `<p class="pop-song">♪ ${esc(lead.title)}<br><span class="pop-alb">${esc(lead.album)}・${yearOf(lead)}</span></p>`
    : `<p class="pop-song">mla 聖地<br><span class="pop-alb">唔係歌詞地點</span></p>`;
  const more = o.songs.length>1 ? `<p class="pop-more">另有 ${o.songs.length-1} 首</p>` : "";
  const teaser = firstLine(o);
  return `<p class="pop-name">${esc(p.name)}</p>
    <p class="pop-meta">${bits.join("　·　")}</p>
    <div class="pop-songs">${song}${more}${teaser ? `<p class="pop-more">${esc(teaser)}</p>` : ""}</div>
    <p class="pop-more"><button class="pop-go" data-go="${p.id}">查看故事 →</button></p>`;
}

NODES.forEach(o=>{
  o.marker = L.marker([o.p.lat,o.p.lng],{
    icon:L.divIcon({className:"", iconSize:[34,34], iconAnchor:[17,17], popupAnchor:[0,-12],
                    html:markerHTML(o)}),
    keyboard:true, title:o.p.name
  }).bindPopup(popupHTML(o),{closeButton:false, offset:[0,-2]});
  o.marker.on("click",()=>highlight(o.p.id));
  o.marker.addTo(map);
});

document.addEventListener("click",e=>{
  const b = e.target.closest(".pop-go");
  if(b){ map.closePopup(); openPlace(b.dataset.go, false); }
});

const routeLayer = L.layerGroup().addTo(map);
function clearRoute(){ routeLayer.clearLayers(); }
function drawRoute(sid){
  clearRoute();
  const ids = ROUTES[sid]; if(!ids) return;
  const pts = ids.map(i=>nodeById[i]).filter(o=>o&&visible(o)).map(o=>[o.p.lat,o.p.lng]);
  if(pts.length < 2) return;
  L.polyline(pts,{color:"#5B4FE9",weight:2.5,opacity:.75,lineCap:"round",lineJoin:"round",interactive:false}).addTo(routeLayer);
}

function syncZoomClass(){
  map.getContainer().classList.toggle("z-far", map.getZoom() < 13);
}
map.on("zoomend", syncZoomClass);

const relLayer = L.layerGroup().addTo(map);
NODES.forEach(o=>{
  const par = o.p.within && nodeById[o.p.within];
  if(par) L.polyline([[o.p.lat,o.p.lng],[par.p.lat,par.p.lng]],
    {color:"#5B4FE9",weight:1.5,opacity:.28,dashArray:"1,6",lineCap:"round",interactive:false}).addTo(relLayer);
});

function applyFilters(){
  NODES.forEach(o=>{
    const v = visible(o), on = map.hasLayer(o.marker);
    if(v && !on) o.marker.addTo(map);
    if(!v && on){ o.marker.closePopup(); map.removeLayer(o.marker); }
  });
  const off = Object.keys(FILTER_ALL).filter(k=>!STATE.filters[k]).length;
  filtBtn.textContent = off ? `篩選・關咗 ${off} 項` : "篩選";
}

/* 手機版 bottom sheet 遮住下半版，fitBounds 要將可見範圍推上去 */
function fitPad(){
  if(!narrow()) return {padding:[56,56]};
  const hidden = sheet ? Math.max(0, window.innerHeight - sheet.getBoundingClientRect().top) : 0;
  return {paddingTopLeft:[28,28], paddingBottomRight:[28, hidden + 28]};
}
function fitRegion(){
  const pts = NODES.filter(o=>inRegion(o)&&visible(o)).map(o=>[o.p.lat,o.p.lng]);
  if(pts.length) map.fitBounds(L.latLngBounds(pts), Object.assign({maxZoom:14}, fitPad()));
}

function paintMarkers(focus, on){
  NODES.forEach(n=>{
    const el = n.marker.getElement(); if(!el) return;
    const mk = el.querySelector(".mk");
    mk.classList.toggle("dim", !!focus && focus.indexOf(n.p.id)<0);
    mk.classList.toggle("on", n.p.id===on);
  });
}

/* ══════════ 畫面切換 ══════════ */
const listEl   = document.getElementById("list");
const labEl    = document.getElementById("listLab");
const noteEl   = document.getElementById("regionNote");
const browseEl = document.getElementById("browse");
const detailEl = document.getElementById("detail");
const regionEl = document.getElementById("regionNav");
const inputEl  = document.getElementById("q");
const unBtn    = document.getElementById("unmappedBtn");
const goneBtn  = document.getElementById("goneBtn");
const methBtn  = document.getElementById("methodBtn");
const modeNav  = document.getElementById("modeNav");
const appEl    = document.querySelector(".app");
const regionBar= document.getElementById("regionBar");
const filtBtn  = document.getElementById("filtBtn");
const filtBox  = document.getElementById("filters");

function syncMode(){
  modeNav.querySelectorAll("button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.m === STATE.mode)));
  regionBar.hidden = STATE.mode !== "places";
  filtBox.hidden = filtBox.hidden || STATE.mode !== "places";
  if(STATE.mode !== "places") filtBox.hidden = true;
}

function showBrowse(){
  browseEl.hidden = false; detailEl.hidden = true;
  document.querySelector(".side").classList.remove("detailing");
  regionEl.style.display = ""; noteEl.style.display = "";
}
function showDetail(html){
  detailEl.innerHTML = html;
  browseEl.hidden = true; detailEl.hidden = false;
  /* 詳情頁：搜尋、地點｜歌曲、區域、篩選全部收埋，畀返成個 sheet 出嚟 */
  document.querySelector(".side").classList.add("detailing");
  sheet.classList.remove("compact");
  filtBox.hidden = true;
  detailEl.scrollTop = 0;
  setSheet(1);
}

/* ══════════ 列表 ══════════ */
function renderSongs(){
  listEl.innerHTML = "";
  const albums = [];
  SONGS.forEach(s=>{
    let a = albums.find(x=>x.name===s.album);
    if(!a){ a = {name:s.album, year:s.year, songs:[]}; albums.push(a); }
    a.songs.push(s);
  });
  albums.sort((a,b)=> a.year-b.year);
  albums.forEach(a=>{
    listEl.appendChild(groupLab(`${a.name}　<b>${a.year}</b>`));
    a.songs.forEach(s=>{
      const n = (refsBySong[s.id]||[]).length;
      const un = (unmappedBySong[s.id]||[]).length;
      const bits = [ n ? `${n} 個地點` : null,
                     ROUTES[s.id] ? `路線 ${ROUTES[s.id].length} 站` : null,
                     un ? `${un} 個未解` : null,
                     s.artist ? esc(s.artist) : null ].filter(Boolean);
      const li = document.createElement("li");
      li.innerHTML = `<button><span class="sg-name">${esc(s.title)}</span>
        <span class="sg-meta">${bits.join("　·　") || "—"}</span></button>`;
      li.querySelector("button").addEventListener("click",()=>openSong(s.id));
      listEl.appendChild(li);
    });
  });
  labEl.textContent = `${SONGS.length} 首有地點嘅歌・${albums.length} 隻碟`;
  noteEl.textContent = `另有 ${COVERAGE.rejected} 首查過但冇地名，未收錄。`;
}

function renderList(){
  if(STATE.mode === "songs") return renderSongs();

  const items = NODES.filter(o=>inList(o)&&visible(o))
    .sort((a,b)=> a.debutYear-b.debutYear || a.debutIdx-b.debutIdx
                || a.p.name.localeCompare(b.p.name,"zh-Hant"));
  listEl.innerHTML = "";

  if(STATE.region === "world"){
    /* 21 個外地點按地區分組，唔係主題策展，亦唔會連線 */
    const g = {};
    items.forEach(o=>{ const z = zoneOf(o.p); (g[z] = g[z] || []).push(o); });
    ZONES.filter(z=>g[z]).forEach(z=>{
      listEl.appendChild(groupLab(`${z}　<b>${g[z].length}</b>`));
      g[z].forEach(o=>listEl.appendChild(placeRow(o)));
    });
    labEl.textContent = `${items.length} 個外地地點`;
  } else {
    items.forEach(o=>listEl.appendChild(placeRow(o)));
    labEl.textContent = `${items.length} 個地方`;
  }

  const other = NODES.filter(o=>!inList(o)&&visible(o)).length;
  noteEl.textContent = STATE.region==="hk"
    ? (other ? `另有 ${other} 個外地地點，切去「世界」睇。` : "")
    : `mla 唱過、去過、想去嘅地方。香港嗰 ${other} 個照樣喺圖上。`;
  unBtn.textContent = `未解之地・${UNMAPPED.length} 個　歌詞講過但搵唔到位置`;
  goneBtn.textContent = `消失的香港・${NODES.filter(o=>o.p.status).length} 個　已經冇咗或者變咗`;
  const cred = document.getElementById("credit");
  if(cred) cred.textContent = `MLA Map by Loegunn・非官方歌迷 project`;
  showBrowse();
}

function placeRow(o, mark){
  const li = document.createElement("li");
  li.dataset.id = o.p.id;
  if(o.p.id===STATE.selectedPlace) li.className = "on";
  const sub  = o.p.precision==="area" ? `<span class="pl-sub">代表點</span>` : "";
  const tag  = o.p.status ? `<span class="pl-tag">${STATUS[o.p.status]}</span>` : "";
  const songs = o.songs.length
    ? o.songs.map(s=>`<i>♪</i>${hl(s.title,mark)}`).join("<br>")
    : `<i>·</i>樂隊相關`;
  const yr = o.debut ? `<span class="pl-year">${o.debutYear}</span>` : "";
  li.innerHTML = `<button>
    ${yr}<span class="pl-name">${hl(o.p.name,mark)}</span>${sub}${tag}
    <span class="pl-songs">${songs}</span></button>`;
  li.querySelector("button").addEventListener("click",()=>openPlace(o.p.id));
  return li;
}

/* ══════════ 選中 / 打開 ══════════ */
function highlight(id){
  STATE.selectedPlace = id;
  paintMarkers(STATE.selectedSong ? songPlaces(STATE.selectedSong) : null, id);
  const rows = listEl.querySelectorAll("li");
  rows.forEach(li=>li.classList.toggle("on", li.dataset.id===id));
}

function openPlace(id, fly){
  const o = nodeById[id]; if(!o) return;
  clearRoute();
  STATE.view = "place"; STATE.selectedSong = null;
  highlight(id);
  if(fly !== false){
    const z = o.p.precision==="exact" ? 16 : 14;
    if(narrow()){
      const hidden = Math.max(0, window.innerHeight - sheet.getBoundingClientRect().top);
      const pt = map.project([o.p.lat,o.p.lng], z).add([0, hidden/2]);
      map.flyTo(map.unproject(pt, z), z, {duration:.5});
    } else {
      map.flyTo([o.p.lat,o.p.lng], z, {duration:.5});
    }
  }
  showDetail(placeDetail(o));
  writeURL(true);
}

function songPlaces(sid){ return (refsBySong[sid]||[]).map(r=>r.place); }

function openSong(sid){
  const s = songById[sid]; if(!s) return;
  STATE.view = "song"; STATE.selectedSong = sid; STATE.selectedPlace = null;
  const ids = songPlaces(sid);
  paintMarkers(ids.length ? ids : null, null);
  drawRoute(sid);
  const pts = ids.map(i=>nodeById[i]).filter(Boolean).map(o=>[o.p.lat,o.p.lng]);
  if(pts.length) map.flyToBounds(L.latLngBounds(pts),{padding:[70,70],maxZoom:15,duration:.5});
  showDetail(songDetail(s));
  writeURL(true);
}

function backToList(){
  STATE.selectedPlace = null; STATE.selectedSong = null;
  clearRoute();
  if(STATE.only){ STATE.only = null; applyFilters(); fitRegion(); }
  paintMarkers(null, null);
  if(STATE.search.trim()){ STATE.view="search"; renderSearch(); }
  else { STATE.view="list"; renderList(); }
  writeURL(true);
}

/* ══════════ 詳情：地方 ══════════ */
function placeDetail(o){
  const p = o.p;
  const bits = [ p.within && placeById[p.within] ? placeById[p.within].name : null,
                 PREC[p.precision],
                 p.status ? STATUS[p.status] : null ].filter(Boolean);

  const songs = o.refs.map(r=>{
    const s = r.song ? songById[r.song] : null;
    const head = s
      ? `<span class="d-song-t">${esc(s.title)}${r.date?`<span class="d-date">歌詞時間 ${esc(r.date)}</span>`:""}</span>
         <span class="d-song-a">${esc(s.album)}・${yearOf(s)}${s.first_year?`（收錄於 ${s.year}）`:""}${s.artist?`　·　${esc(s.artist)}`:""}</span>`
      : `<span class="d-song-t">樂隊背景</span><span class="d-song-a">唔係歌詞地點</span>`;
    const links = s ? `<span class="links">
        <a href="https://www.youtube.com/results?search_query=${q(s.title)}" target="_blank" rel="noopener">YouTube</a>
        <a href="https://open.spotify.com/search/${q(s.title)}" target="_blank" rel="noopener">Spotify</a>
        <button data-song="${s.id}">睇呢首歌全部地點</button>
      </span>` : "";
    const ev = r.line ? `<p class="d-lyric">${esc(lyricOf(r))}</p>` : "";
    return `<div class="d-song">${head}${ev}${r.note?`<p class="d-song-n">${esc(r.note)}</p>`:""}${links}</div>`;
  }).join("");

  const rtLine = (ROUTE_OF[p.id]||[]).map(rt=>
    `<p class="route-tag">屬於〈${esc(songById[rt.song].title)}〉路線・第 ${rt.step} 站（共 ${rt.total} 站）　<button data-song="${rt.song}">睇成條路線</button></p>`).join("");

  const sameSong = [];
  o.refs.forEach(r=>{
    (refsBySong[r.song]||[]).forEach(x=>{
      if(x.place!==p.id && nodeById[x.place] && !sameSong.some(y=>y.id===x.place))
        sameSong.push({id:x.place, via:songById[r.song].title});
    });
  });
  const kids = PLACES.filter(x=>x.within===p.id && nodeById[x.id]);
  const par  = p.within && nodeById[p.within] ? placeById[p.within] : null;
  const rel  = (par?[par]:[]).concat(kids);

  return `<button class="back" data-back>← 返回</button>
    <p class="d-name">${esc(p.name)}</p>
    ${rtLine}
    <p class="d-meta">${bits.join("　·　")}</p>
    ${p.note ? `<div class="d-sec"><p class="d-lab">關於呢個地方</p><p class="d-note">${esc(p.note)}</p></div>` : ""}
    <div class="d-sec"><p class="d-lab">出現於・${o.refs.length} 條</p>${songs}</div>
    ${sameSong.length ? `<div class="d-sec"><p class="d-lab">同一首歌嘅其他地方</p><ul class="d-rel">${
      sameSong.map(x=>`<li><button data-place="${x.id}">${esc(placeById[x.id].name)}</button><span>經〈${esc(x.via)}〉</span></li>`).join("")
    }</ul></div>` : ""}
    ${rel.length ? `<div class="d-sec"><p class="d-lab">相關地方</p><div class="rel-places">${
      rel.map(x=>`<button data-place="${x.id}">${esc(x.name)}</button>`).join("")}</div></div>` : ""}
    <div class="d-sec"><p class="d-lab">實地</p><span class="links">
      <a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">Google 地圖</a>
      <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lng}" target="_blank" rel="noopener">街景</a>
    </span></div>`;
}

/* ══════════ 詳情：歌 ══════════ */
function songDetail(s){
  const order = ROUTES[s.id] || null;
  let refs = (refsBySong[s.id] || []).slice();
  if(order) refs.sort((a,b)=>{
    const ia = order.indexOf(a.place), ib = order.indexOf(b.place);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  const stops = refs.map(r=>{
    const n = order ? order.indexOf(r.place) : -1;
    const num = n>=0 ? `<span class="stop-n">${String(n+1).padStart(2,"0")}</span>` : "";
    const o = nodeById[r.place]; if(!o) return "";
    const bits = [PREC[o.p.precision], o.p.status?STATUS[o.p.status]:null].filter(Boolean);
    return `<div class="d-song">
      <span class="d-song-t">${num}<button data-place="${o.p.id}">${esc(o.p.name)}</button>${
        r.date?`<span class="d-date">歌詞時間 ${esc(r.date)}</span>`:""}${
        order && n<0 ? `<span class="d-date">唔喺路線上</span>` : ""}</span>
      <span class="d-song-a">${bits.join("　·　")}</span>
      ${r.line?`<p class="d-lyric">${esc(lyricOf(r))}</p>`:""}
      ${r.note?`<p class="d-song-n">${esc(r.note)}</p>`:""}</div>`;
  }).join("");
  const un = (unmappedBySong[s.id]||[]).map(u=>
    `<div class="d-song"><span class="d-song-t">？ ${esc(u.label)}</span>
     <p class="d-song-n">${esc(u.why)}</p></div>`).join("");

  return `<button class="back" data-back>← 返回</button>
    <p class="d-name">${esc(s.title)}</p>
    <p class="d-meta">${esc(s.album)}・${yearOf(s)}${s.first_year?`（收錄於 ${s.year}）`:""}${
      s.artist?`　·　${esc(s.artist)}`:""}${s.alt&&s.alt.length?`　·　異名：${esc(s.alt.join("、"))}`:""}</p>
    <div class="d-sec"><p class="d-lab">${order ? `路線・${order.length} 站` : (refs.length ? `歌入面嘅地點・${refs.length} 個` : "地點")}</p>
      ${stops || `<p class="d-empty">呢首歌未有落到圖嘅地點。</p>`}</div>
    ${un ? `<div class="d-sec"><p class="d-lab">未解之地</p>${un}</div>` : ""}
    <div class="d-sec"><p class="d-lab">聽歌</p><span class="links">
      <a href="https://www.youtube.com/results?search_query=${q(s.title)}" target="_blank" rel="noopener">YouTube</a>
      <a href="https://open.spotify.com/search/${q(s.title)}" target="_blank" rel="noopener">Spotify</a>
    </span></div>`;
}

/* ══════════ 未解之地 ══════════ */
function unmappedView(){
  STATE.view = "unmapped"; STATE.selectedPlace = null; STATE.selectedSong = null; clearRoute();
  paintMarkers(null,null);
  const items = UNMAPPED.map(u=>{
    const s = songById[u.song];
    return `<div class="d-song">
      <span class="d-song-t">？ ${esc(u.label)}</span>
      ${s?`<span class="d-song-a"><button data-song="${s.id}">${esc(s.title)}</button>　·　${esc(s.album)}・${yearOf(s)}</span>`:""}
      <p class="d-song-n">${esc(u.why)}</p></div>`;
  }).join("");
  showDetail(`<button class="back" data-back>← 返回</button>
    <p class="d-name">未解之地</p>
    <p class="d-meta">${UNMAPPED.length} 個</p>
    <div class="d-sec"><p class="d-body">歌詞有名有姓講過一個地方，但考證唔到佢喺邊 —— 可能係舊舖冇公開門牌，可能係同名太多分唔到邊間，可能係歌詞根本冇講明。呢啲地方唔會出現喺地圖上，但照樣列出嚟：唔確定本身都係資料，扮有反而係造假。<br><br>如果你知道邊個喺邊，歡迎話我知。</p></div>
    <div class="d-sec">${items}</div>`);
  writeURL(true);
}

/* ══════════ 消失的香港 ══════════ */
function goneView(){
  STATE.view = "gone"; STATE.only = "status"; clearRoute();
  STATE.selectedPlace = null; STATE.selectedSong = null;
  applyFilters(); paintMarkers(null,null);

  const list = NODES.filter(o=>o.p.status)
    .sort((a,b)=> (a.p.status==="gone"?0:1)-(b.p.status==="gone"?0:1));
  const pts = list.map(o=>[o.p.lat,o.p.lng]);
  if(pts.length) map.flyToBounds(L.latLngBounds(pts),{padding:[70,70],maxZoom:14,duration:.6});

  const items = list.map(o=>{
    const r = o.refs.find(x=>x.date) || o.refs[0] || {};
    const s = r.song ? songById[r.song] : null;
    const line = firstLine(o);
    return `<div class="d-song">
      <span class="d-song-t"><button data-place="${o.p.id}">${esc(o.p.name)}</button>
        <span class="d-date">${STATUS[o.p.status]}${r.date?"・"+esc(r.date):""}</span></span>
      ${s?`<span class="d-song-a">♪ ${esc(s.title)}　·　${esc(s.album)}・${yearOf(s)}</span>`:""}
      ${line?`<p class="d-song-n">${esc(line)}</p>`:""}
      ${o.p.note?`<p class="d-song-n">${esc(o.p.note)}</p>`:""}</div>`;
  }).join("");

  showDetail(`<button class="back" data-back>← 返回</button>
    <p class="d-name">消失的香港</p>
    <p class="d-meta">${list.length} 個已經唔喺度、或者仲喺度但已經唔同咗嘅地方</p>
    <div class="d-sec">${items}</div>`);
  writeURL(true);
}

/* ══════════ 考證方法 ══════════ */
function methodView(){
  STATE.view = "method"; STATE.only = null;
  STATE.selectedPlace = null; STATE.selectedSong = null;
  clearRoute(); paintMarkers(null,null);

  const n = k => NODES.filter(k).length;
  const kinds = [
    ["mk",            "歌詞地點・準確位置", n(o=>o.kind==="lyric"&&o.p.precision==="exact"&&!o.p.status),
     "歌詞講明，而且考證到實際位置。撳落去會有經緯度同街景連結。"],
    ["mk area",       "歌詞地點・地區代表點", n(o=>o.kind==="lyric"&&o.p.precision==="area"&&!o.p.status),
     "知道係邊一區，但落唔到確實位置。多數用地鐵站或者該區中心做代表坐標 —— 個點唔等於歌講嗰個地方，只係話你知大概喺邊。"],
    ["mk meta",       "mla 聖地", n(o=>o.kind==="meta"),
     "唔係歌詞講嘅地點，係樂隊本身嘅地方。同歌詞地點分開，因為兩者嘅證據級別唔同。"],
    ["mk gone",       "已消失", n(o=>o.p.status==="gone"),
     "歌入面嗰個地方而家已經唔喺度。"],
    ["mk changed",    "已變質", n(o=>o.p.status==="changed"),
     "地方仲喺度，但同歌講嗰陣已經唔同咗。"]
  ].map(([cls,name,cnt,desc])=>`<div class="d-song">
      <span class="d-song-t"><span class="${cls}">${cls.includes("area")?'<span class="halo"></span>':""}<span class="core"></span></span>${name}
        <span class="d-date">${cnt} 個</span></span>
      <p class="d-song-n">${desc}</p></div>`).join("");

  const withLine = REFS.filter(r=>r.line).length;

  showDetail(`<button class="back" data-back>← 返回</button>
    <p class="d-name">考證方法</p>
    <p class="d-meta">${NODES.length} 個地點・${REFS.length} 條關聯</p>

    <div class="d-sec"><p class="d-lab">覆蓋範圍</p>
      <p class="d-body">逐首核過 ${COVERAGE.total} 首曲目，${COVERAGE.mapped} 首有地方掛住而收咗入嚟，${COVERAGE.rejected} 首查完確認冇地名或者地名唔構成一個地點，${COVERAGE.pending} 首有線索但未確認。呢啲數由核實表即場統計，唔係人手寫死。</p></div>

    <div class="d-sec"><p class="d-lab">一條原則</p>
      <p class="d-body">唔肯定，就唔假裝肯定。落得到區就落區，落唔到就唔落 —— 唔會為咗個地圖好睇而砌一個點出嚟。</p></div>

    <div class="d-sec"><p class="d-lab">五種點</p>${kinds}</div>

    <div class="d-sec"><p class="d-lab">歌詞證據</p>
      <p class="d-body">${REFS.length} 條關聯入面，${withLine} 條有直接歌詞證據，會喺地點頁用紫線標出。其餘 ${REFS.length-withLine} 條留白 —— 通常係地名喺歌名而唔喺歌詞（例如〈火炭麗琪〉〈九龍公園游泳池〉）。留白唔會用其他文字頂上。</p></div>

    <div class="d-sec"><p class="d-lab">路線</p>
      <p class="d-body">只有 ${Object.keys(ROUTES).length} 首歌畫咗路線：歌詞本身明確講出次序、而且實地核到行得通嘅先連。次序靠估嘅一律唔連。</p></div>

    <div class="d-sec"><p class="d-lab">未解之地</p>
      <p class="d-body">${UNMAPPED.length} 個歌詞講過、但搵唔到位置嘅地方。佢哋唔喺地圖上，但照樣列出嚟 —— 唔確定本身都係資料。</p>
      <p class="d-body"><button data-view="unmapped" class="pop-go">睇未解之地 →</button></p></div>

    <div class="d-sec"><p class="d-lab">關於呢個 project</p>
      <p class="d-body">非官方、非商業嘅個人 project。同 my little airport、其唱片公司及任何相關單位冇任何關係，未經授權，亦唔代表樂隊立場。歌詞版權歸原權利人所有，本站只引用短句作地理考證用途，唔提供完整歌詞。</p>
      <p class="d-body">地圖介面同考證整理係個人研究成果，未授予任何開源授權。引用請註明出處：MLA Map by Loegunn。</p>
      <p class="d-body">如果你係版權持有人或者地點業主，覺得本站內容侵犯咗你嘅權益，請話我知，我會即時移除，唔會爭辯。</p></div>`);
  writeURL(true);
}

/* ══════════ 搜尋 ══════════ */
function norm(t){ return String(t==null?"":t).toLowerCase(); }
function hl(text, mark){
  const t = esc(text);
  if(!mark) return t;
  const i = norm(t).indexOf(norm(mark));
  return i<0 ? t : t.slice(0,i) + "<mark>" + t.slice(i,i+mark.length) + "</mark>" + t.slice(i+mark.length);
}

function searchAll(kw){
  const k = norm(kw);
  const placeHits = NODES.filter(o=>
    norm(o.p.name).indexOf(k)>=0 || norm(o.p.note).indexOf(k)>=0 ||
    o.refs.some(r=>norm(r.note).indexOf(k)>=0));
  const songHits = SONGS.filter(s=>
    norm(s.title).indexOf(k)>=0 || norm(s.album).indexOf(k)>=0 || norm(s.artist).indexOf(k)>=0 ||
    (s.alt||[]).some(a=>norm(a).indexOf(k)>=0) ||
    (refsBySong[s.id]||[]).some(r=>
      norm(r.note).indexOf(k)>=0 || norm(placeById[r.place] && placeById[r.place].name).indexOf(k)>=0));
  const unHits = UNMAPPED.filter(u=>
    norm(u.label).indexOf(k)>=0 || norm(u.why).indexOf(k)>=0 ||
    norm(songById[u.song] && songById[u.song].title).indexOf(k)>=0);
  return {placeHits, songHits, unHits};
}

function groupLab(text){
  const li = document.createElement("li");
  li.style.borderTop = "0";
  li.innerHTML = `<p class="list-lab" style="padding-top:16px">${text}</p>`;
  return li;
}

function renderSearch(){
  const kw = STATE.search.trim();
  const res = searchAll(kw);
  const total = res.placeHits.length + res.songHits.length + res.unHits.length;
  listEl.innerHTML = "";

  if(!total){
    labEl.textContent = "";
    const li = document.createElement("li");
    li.innerHTML = `<div style="padding:14px 22px;color:var(--ink-3);font-size:13px">搵唔到「${esc(kw)}」。試下歌名、地名、專輯名，或者考證註解入面嘅字眼。</div>`;
    listEl.appendChild(li);
  }else{
    if(res.placeHits.length){
      listEl.appendChild(groupLab(`地方・${res.placeHits.length}`));
      res.placeHits.forEach(o=>listEl.appendChild(placeRow(o, kw)));
    }
    if(res.songHits.length){
      listEl.appendChild(groupLab(`歌曲・${res.songHits.length}`));
      res.songHits.forEach(s=>{
        const n = (refsBySong[s.id]||[]).length;
        const li = document.createElement("li");
        li.innerHTML = `<button>
          <span class="pl-name">${hl(s.title,kw)}</span>
          <span class="hit-sub">${hl(s.album,kw)}・${yearOf(s)}　·　${n ? n+" 個地點" : "未有地點"}</span></button>`;
        li.querySelector("button").addEventListener("click",()=>openSong(s.id));
        listEl.appendChild(li);
      });
    }
    if(res.unHits.length){
      listEl.appendChild(groupLab(`未解之地・${res.unHits.length}`));
      res.unHits.forEach(u=>{
        const s = songById[u.song];
        const li = document.createElement("li");
        li.innerHTML = `<button>
          <span class="pl-name">？ ${hl(u.label,kw)}</span>
          ${s?`<span class="hit-sub">${hl(s.title,kw)}</span>`:""}
          <span class="hit-why">${hl(u.why,kw)}</span></button>`;
        li.querySelector("button").addEventListener("click",()=>unmappedView());
        listEl.appendChild(li);
      });
    }
    labEl.textContent = `${total} 個結果`;
  }
  noteEl.textContent = "搜尋範圍：歌名、地名、專輯、異名、考證註解。";
  unBtn.textContent = `未解之地・${UNMAPPED.length} 個　歌詞講過但搵唔到位置`;
  goneBtn.textContent = `消失的香港・${NODES.filter(o=>o.p.status).length} 個　已經冇咗或者變咗`;
  const cred = document.getElementById("credit");
  if(cred) cred.textContent = `MLA Map by Loegunn・非官方歌迷 project`;
  showBrowse();
}

let typing;
inputEl.addEventListener("input",()=>{
  clearTimeout(typing);
  typing = setTimeout(()=>{
    STATE.search = inputEl.value;
    STATE.selectedPlace = null; STATE.selectedSong = null;
    paintMarkers(null,null);
    if(STATE.search.trim()){ STATE.view="search"; renderSearch(); }
    else { STATE.view="list"; renderList(); }
    writeURL();
  }, 140);
});
inputEl.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ inputEl.value=""; STATE.search=""; STATE.view="list"; renderList(); }
});

/* ══════════ 委派 ══════════ */
detailEl.addEventListener("click",e=>{
  const v = e.target.closest("[data-view]");
  if(v){ if(v.dataset.view==="unmapped") unmappedView(); return; }
  if(e.target.closest("[data-back]")){ backToList(); return; }
  const pl = e.target.closest("[data-place]");
  if(pl){ openPlace(pl.dataset.place); return; }
  const sg = e.target.closest("[data-song]");
  if(sg){ openSong(sg.dataset.song); }
});
unBtn.addEventListener("click",unmappedView);
goneBtn.addEventListener("click",goneView);
methBtn.addEventListener("click",methodView);

modeNav.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  STATE.mode = b.dataset.m;
  STATE.search = ""; inputEl.value = "";
  syncMode(); backToList(); fitRegion();
});

filtBtn.addEventListener("click",()=>{
  const on = filtBox.hidden;
  filtBox.hidden = !on;
  filtBtn.setAttribute("aria-expanded", String(on));
});
filtBox.addEventListener("change",e=>{
  const cb = e.target.closest("input[data-f]"); if(!cb) return;
  STATE.filters[cb.dataset.f] = cb.checked;
  if(STATE.only){ STATE.only = null; }
  applyFilters();
  if(STATE.search.trim()) renderSearch(); else renderList();
  fitRegion(); writeURL();
});
document.getElementById("filtReset").addEventListener("click",()=>{
  Object.assign(STATE.filters, FILTER_ALL);
  filtBox.querySelectorAll("input[data-f]").forEach(cb=>cb.checked = true);
  STATE.only = null;
  applyFilters();
  if(STATE.search.trim()) renderSearch(); else renderList();
  fitRegion(); writeURL();
});

regionEl.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  STATE.region = b.dataset.v;
  const btns = regionEl.querySelectorAll("button");
  btns.forEach(x=>x.setAttribute("aria-pressed", String(x===b)));
  if(STATE.search.trim()) renderSearch(); else renderList();
  fitRegion(); writeURL();
});

function toggler(btnId, boxId){
  const btn = document.getElementById(btnId), box = document.getElementById(boxId);
  btn.addEventListener("click",()=>{
    const on = box.classList.toggle("on");
    btn.setAttribute("aria-expanded", String(on));
  });
}
toggler("legendBtn","legend");

/* 電腦版：收埋左邊 sidebar，畀返成版地圖 */
const sideBtn = document.createElement("button");
sideBtn.className = "map-btn"; sideBtn.id = "sideToggle";
sideBtn.textContent = "◀ 收埋";
sideBtn.setAttribute("aria-label","收埋或展開側欄");
document.querySelector(".mapcol").appendChild(sideBtn);
sideBtn.addEventListener("click",()=>{
  const folded = appEl.classList.toggle("folded");
  sideBtn.textContent = folded ? "▶ 列表" : "◀ 收埋";
  setTimeout(()=>{ map.invalidateSize(); fitRegion(); }, 220);
});
toggler("aboutBtn","about");

/* ══════════ 網址狀態 ══════════ */
let restoring = false;

function writeURL(push){
  if(restoring) return;
  const p = new URLSearchParams();
  if(STATE.region !== "hk") p.set("region", STATE.region);
  if(STATE.view === "place" && STATE.selectedPlace) p.set("place", STATE.selectedPlace);
  if(STATE.view === "song"  && STATE.selectedSong)  p.set("song",  STATE.selectedSong);
  if(STATE.view === "gone")     p.set("view","gone");
  if(STATE.view === "method")   p.set("view","method");
  if(STATE.mode === "songs")    p.set("mode","songs");
  if(STATE.view === "unmapped") p.set("view","unmapped");
  if(STATE.search.trim()) p.set("q", STATE.search.trim());
  const off = Object.keys(FILTER_ALL).filter(k=>!STATE.filters[k]);
  if(off.length) p.set("off", off.join(","));
  const s = p.toString();
  const url = location.pathname + location.search + (s ? "#" + s : "");
  if(url === location.href.replace(location.origin,"")) return;
  history[push ? "pushState" : "replaceState"](null, "", url);
}

function readURL(){
  restoring = true;
  const p = new URLSearchParams(location.hash.replace(/^#/,""));

  STATE.mode = p.get("mode") === "songs" ? "songs" : "places";
  syncMode();
  STATE.region = p.get("region") === "world" ? "world" : "hk";
  regionEl.querySelectorAll("button").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.v === STATE.region)));

  Object.assign(STATE.filters, FILTER_ALL);
  (p.get("off")||"").split(",").filter(Boolean).forEach(k=>{
    if(k in STATE.filters) STATE.filters[k] = false;
  });
  filtBox.querySelectorAll("input[data-f]").forEach(cb=> cb.checked = STATE.filters[cb.dataset.f]);
  const anyOff = Object.keys(FILTER_ALL).some(k=>!STATE.filters[k]);
  filtBox.hidden = !anyOff;
  filtBtn.setAttribute("aria-expanded", String(anyOff));

  STATE.search = p.get("q") || "";
  inputEl.value = STATE.search;

  STATE.only = null;
  STATE.selectedPlace = null; STATE.selectedSong = null;
  applyFilters();

  const place = p.get("place"), song = p.get("song"), view = p.get("view");
  if(place && nodeById[place])      openPlace(place);
  else if(song && songById[song])   openSong(song);
  else if(view === "gone")          goneView();
  else if(view === "method")        methodView();
  else if(view === "unmapped")      unmappedView();
  else {
    paintMarkers(null,null);
    if(STATE.search.trim()){ STATE.view = "search"; renderSearch(); }
    else { STATE.view = "list"; renderList(); }
    fitRegion();
  }
  restoring = false;
}

window.addEventListener("popstate", readURL);
window.addEventListener("hashchange",()=>{ if(!restoring) readURL(); });

/* ══════════ Bottom sheet（mobile） ══════════ */
const sheet = document.getElementById("sheet");
const grip  = document.getElementById("grip");
let snaps = [0,0,0], cur = 1;
const isMobile = () => window.matchMedia("(max-width:820px)").matches;

function calcSnaps(){
  const h = sheet.offsetHeight;
  snaps = [h-104, Math.round(h*.48), 0];
}
function setSheet(i){
  if(!isMobile()) return;
  cur = Math.max(0, Math.min(2, i));
  sheet.style.transform = `translateY(${snaps[cur]}px)`;
}
function initSheet(){
  if(!isMobile()){ sheet.style.transform = ""; sheet.style.removeProperty("--sheetoff"); return; }
  calcSnaps(); setSheet(cur);
}
window.addEventListener("resize",()=>{ initSheet(); map.invalidateSize(); });

/* 碌列表時將標題收埋，畀返空間 */
function watchScroll(el){
  if(!el) return;
  el.addEventListener("scroll",()=>{
    if(!isMobile() || sheet.classList.contains("detailing")) return;
    const y = el.scrollTop, on = sheet.classList.contains("compact");
    if(!on && y > 40) sheet.classList.add("compact");
    else if(on && y < 4) sheet.classList.remove("compact");
  }, {passive:true});
}
watchScroll(document.getElementById("browse"));
watchScroll(detailEl);

let dragY = null, startT = 0;
grip.addEventListener("pointerdown",e=>{
  if(!isMobile()) return;
  dragY = e.clientY; startT = snaps[cur];
  sheet.classList.add("dragging"); grip.setPointerCapture(e.pointerId);
});
grip.addEventListener("pointermove",e=>{
  if(dragY===null) return;
  const y = Math.max(0, Math.min(snaps[0], startT + (e.clientY-dragY)));
  sheet.style.transform = `translateY(${y}px)`;
  sheet.style.setProperty("--sheetoff", y + "px");
});
grip.addEventListener("pointerup",e=>{
  if(dragY===null) return;
  const y = startT + (e.clientY-dragY);
  let best = 0;
  snaps.forEach((s,i)=>{ if(Math.abs(s-y) < Math.abs(snaps[best]-y)) best = i; });
  sheet.classList.remove("dragging"); dragY = null; setSheet(best);
});
grip.addEventListener("click",()=>{ if(isMobile()) setSheet(cur===2 ? 1 : 2); });

map.on("popupopen",()=>{ if(isMobile() && cur!==0) setSheet(0); });

/* ══════════ 起動 ══════════ */
document.getElementById("statLine").textContent =
  `${NODES.length} 個地方・${REFS.length} 條關聯・${UNMAPPED.length} 個未解`;

readURL();
initSheet();
map.whenReady(()=>{ syncZoomClass(); setTimeout(()=>map.invalidateSize(),60); });
window.addEventListener("load",()=>map.invalidateSize());
</script>
